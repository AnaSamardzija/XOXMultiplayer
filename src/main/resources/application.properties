spring.application.name=XOXMultiplayer
spring.main.banner-mode=off

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:xox}
spring.datasource.username=${MYSQLUSER:admin}
spring.datasource.password=${MYSQLPASSWORD:admin.123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

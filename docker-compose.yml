services:
  db:
    image: mysql:8.4
    ports:
      - "3306:3306"
    container_name: xox-db-container
    environment:
      MYSQL_ROOT_PASSWORD: root.123
      MYSQL_DATABASE: xox
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin.123
    restart: unless-stopped
    volumes:
      - xox-db-volume:/var/lib/mysql

volumes:
  xox-db-volume:
